<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Universal Share - Automated Verification Tests</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #0f172a; color: #f8fafc; }
    .pass { color: #10b981; }
    .fail { color: #ef4444; font-weight: bold; }
    .log-item { margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h2>⚡ Universal Share - Verification Test Suite</h2>
  <div id="results"></div>

  <script src="../js/crypto.js"></script>
  <script src="../js/sdp-compress.js"></script>
  <script src="../js/jsqr.min.js"></script>
  <script src="../js/qr-codec.js"></script>

  <script>
    const results = document.getElementById('results');

    function log(msg, passed = true) {
      const div = document.createElement('div');
      div.className = `log-item ${passed ? 'pass' : 'fail'}`;
      div.textContent = `${passed ? '✓ PASS' : '✗ FAIL'}: ${msg}`;
      results.appendChild(div);
      console.log(div.textContent);
    }

    async function runTests() {
      try {
        // Test 1: Crypto Key Generation & Export
        const aliceCrypto = new UniCrypto();
        const bobCrypto = new UniCrypto();

        await aliceCrypto.generateKeyPair();
        await bobCrypto.generateKeyPair();

        const aliceRawPub = await aliceCrypto.exportPublicKey();
        const bobRawPub = await bobCrypto.exportPublicKey();

        log(`Alice & Bob generated ECDH P-256 keypairs (Alice pubkey: ${aliceRawPub.byteLength} bytes)`, aliceRawPub.byteLength === 65);

        // Test 2: Shared Key Derivation & SAS Match
        const aliceSas = await aliceCrypto.establishSharedKey(bobRawPub);
        const bobSas = await bobCrypto.establishSharedKey(aliceRawPub);

        const sasMatch = (aliceSas.sasCode === bobSas.sasCode) && (aliceSas.sasEmoji === bobSas.sasEmoji);
        log(`Alice & Bob derived identical 6-digit SAS (${aliceSas.sasCode}) and Emoji (${aliceSas.sasEmoji})`, sasMatch);

        // Test 3: AES-GCM-256 Encrypt & Decrypt Round-trip
        const testPlaintext = new TextEncoder().encode("Universal Share 100% Secure Local P2P Transfer!");
        const encrypted = await aliceCrypto.encryptChunk(testPlaintext);
        log(`Encrypted 48-byte plaintext into ${encrypted.byteLength}-byte ciphertext (with 12B IV + 16B tag)`, encrypted.byteLength === testPlaintext.byteLength + 28);

        const decrypted = await bobCrypto.decryptChunk(encrypted);
        const decryptedText = new TextDecoder().decode(decrypted);
        log(`Bob successfully decrypted Alice's chunk: "${decryptedText}"`, decryptedText === "Universal Share 100% Secure Local P2P Transfer!");

        // Test 4: SHA-256 Digest Verification
        const sampleBuffer = new TextEncoder().encode("Integrity check test vector");
        const hash = await UniCrypto.sha256(sampleBuffer);
        log(`SHA-256 hash computed: ${hash}`, typeof hash === 'string' && hash.length === 64);

        // Test 5: Compact SDP Serializer Round-trip (with whitespace & newline stress test)
        const mockSdp = [
          'v=0',
          'o=- 123456789 2 IN IP4 127.0.0.1',
          's=-',
          't=0 0',
          'a=group:BUNDLE 0',
          'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
          'c=IN IP4 0.0.0.0',
          'a=mid:0',
          'a=setup:actpass',
          'a=ice-ufrag:testUfrag8',
          'a=ice-pwd:testPassword1234567890',
          'a=fingerprint:sha-256 01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF',
          'a=candidate:1 1 UDP 2122260223 192.168.1.50 54321 typ host',
          'a=candidate:2 1 UDP 2122260223 172.20.10.9 54322 typ host'
        ].join('\r\n') + '\r\n';

        const offerPayload = {
          type: 'offer',
          sdp: mockSdp,
          key: Array.from(aliceRawPub)
        };

        const token = await SdpCompressor.compress(offerPayload);
        log(`Generated compact token: ${token.length} chars (starts with US1:)`, token.startsWith('US1:') && token.length < 500);

        // Stress test: insert random spaces and newlines like iOS copy-paste
        const dirtyToken = `  \n  ${token.slice(0, 30)} \n ${token.slice(30, 80)} \r\n ${token.slice(80)}  \n `;
        const decompressed = await SdpCompressor.decompress(dirtyToken);
        log(`Decompressed dirty token successfully: type=${decompressed.type}`, decompressed.type === 'offer');
        log(`Reconstructed SDP contains ufrag, pwd, fingerprint, candidates`, 
          decompressed.sdp.includes('testUfrag8') && 
          decompressed.sdp.includes('testPassword1234567890') &&
          decompressed.sdp.includes('192.168.1.50')
        );

        // Test 6: QR Generator & Scanner Engine (Canvas Render -> jsQR Decode)
        log(`jsQR engine available on window`, typeof window.jsQR === 'function');
        const canvas = document.createElement('canvas');
        QRGenerator.render(canvas, token, { size: 300, errorCorrection: 'M' });
        log(`QR Code generated onto canvas: ${canvas.width}x${canvas.height}px`, canvas.width > 0);

        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const scanResult = window.jsQR(imgData.data, imgData.width, imgData.height);
        log(`jsQR scanned generated QR code directly: matches token`, scanResult && scanResult.data === token);

        log("ALL TESTS COMPLETED SUCCESSFULLY! 🎉", true);
      } catch (err) {
        log(`Unexpected test failure: ${err.message}`, false);
        console.error(err);
      }
    }

    runTests();
  </script>
</body>
</html>

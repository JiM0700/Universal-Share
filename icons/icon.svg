<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Concentric Radar Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="8" />
  
  <!-- Center Thunderbolt & Share Beam -->
  <path d="M280 80 L160 270 L240 270 L210 430 L360 230 L270 230 Z" fill="url(#grad)" filter="url(#glow)" />
</svg>
